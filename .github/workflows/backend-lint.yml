name: Backend Lint

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        cd backend
        poetry install
    - name: Run Ruff
      run: cd backend && poetry run ruff check .
    - name: Run Black
      run: cd backend && poetry run black --check .
    - name: Run isort
      run: cd backend && poetry run isort --check-only .
