syntax = "proto3";
package sentinel.common;
option go_package = "github.com/sentinel/services/go/pkg/proto/common";

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message EntityRef {
  string id = 1;
  string type = 2;
  string name = 3;
}

message Metadata {
  map<string, string> entries = 1;
}

message Pagination {
  int32 page = 1;
  int32 page_size = 2;
  int32 total = 3;
}
