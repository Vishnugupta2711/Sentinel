worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ─── Logging ─────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"request_id":"$request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ─── Performance ─────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 50M;
    server_tokens off;

    # ─── Gzip Compression ────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ─── Rate Limiting Zones ─────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m  rate=5r/s;
    limit_req_zone $binary_remote_addr zone=static_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ─── Security Headers (global) ───────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:;" always;

    # ─── Upstreams ───────────────────────────────────────────────
    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 64;
    }

    # ─── Proxy Cache ─────────────────────────────────────────────
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=api_cache:10m
                     max_size=256m inactive=10m use_temp_path=off;

    server {
        listen 80;
        server_name localhost _;

        # ─── Health check for NGINX itself ────────────────────────
        location /nginx-health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # ─── Frontend (Next.js) ───────────────────────────────────
        location / {
            limit_req zone=static_limit burst=50 nodelay;
            limit_conn conn_limit 100;

            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            # Static asset caching
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                proxy_pass http://frontend_upstream;
                proxy_cache api_cache;
                proxy_cache_valid 200 30m;
                add_header X-Cache-Status $upstream_cache_status;
                expires 30d;
            }
        }

        # ─── Backend API ──────────────────────────────────────────
        location /api/v1/ {
            limit_req zone=api_limit burst=60 nodelay;
            limit_conn conn_limit 50;

            proxy_pass http://backend_upstream/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # Cache GET responses for non-websocket API calls
            proxy_cache api_cache;
            proxy_cache_methods GET;
            proxy_cache_valid 200 5s;
            proxy_cache_bypass $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ─── Backend WebSocket ────────────────────────────────────
        location /api/v1/ws/ {
            limit_req zone=ws_limit burst=10 nodelay;

            proxy_pass http://backend_upstream/api/v1/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;

            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
            proxy_buffering     off;
        }

        # ─── Swagger docs ────────────────────────────────────────
        location /docs {
            proxy_pass http://backend_upstream/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /redoc {
            proxy_pass http://backend_upstream/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass http://backend_upstream/api/v1/openapi.json;
            proxy_set_header Host $host;
        }

        # ─── Prometheus Metrics (internal only) ──────────────────────
        location /metrics {
            # Restricted to Docker internal network and monitoring services
            allow 172.28.0.0/16;   # sentinel-net subnet
            allow 127.0.0.1;
            deny  all;
            proxy_pass http://backend_upstream/metrics;
            proxy_set_header Host $host;
        }

        # ─── Error pages ─────────────────────────────────────────
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            return 502 '{"error":"Service temporarily unavailable","code":502}';
            add_header Content-Type application/json always;
        }
    }
}
