[project]
name = "sentinel-backend"
version = "0.1.0"
description = "AEGIS Backend"
authors = [
    {name = "AI Assistant",email = "ai@example.com"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi (>=0.138.1,<0.139.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.0.1,<9.0.0)",
    "kafka-python (>=3.0.6,<4.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "neo4j (>=6.2.0,<7.0.0)",
    "qdrant-client (>=1.18.0,<2.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "websockets (>=16.0,<17.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "prometheus-client (>=0.25.0,<0.26.0)",
    "psutil (>=7.2.2,<8.0.0)",
    "prometheus-fastapi-instrumentator (>=8.0.2,<9.0.0)",
    "uvloop (>=0.22.1,<0.23.0)",
    "opencv-python-headless (>=4.9.0.80,<5.0.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.15.20,<0.16.0)",
    "isort (>=8.0.1,<9.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.ruff.lint]
ignore = ['E402', 'E701']
