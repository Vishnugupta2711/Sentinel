global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    cluster: sentinel-production
    environment: production

rule_files:
  - "alerts.yml"

scrape_configs:
  # ─── Sentinel Backend ───────────────────────────────────────
  - job_name: "sentinel_backend"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend
          component: api

  # ─── NGINX ──────────────────────────────────────────────────
  - job_name: "sentinel_nginx"
    metrics_path: "/nginx-health"
    scrape_interval: 30s
    static_configs:
      - targets: ["nginx:80"]
        labels:
          service: nginx
          component: proxy

  # ─── Redis ──────────────────────────────────────────────────
  - job_name: "sentinel_redis"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets: ["redis:6379"]
        labels:
          service: redis
          component: cache

  # ─── PostgreSQL ─────────────────────────────────────────────
  - job_name: "sentinel_postgres"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres:5432"]
        labels:
          service: postgres
          component: database

  # ─── Prometheus self-monitoring ─────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
